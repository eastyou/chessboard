[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chessboard"
version = "0.1.0"
description = "国际象棋棋盘与棋子裁剪页：FEN 局面、可打印棋盘与走法练习卡"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["chess", "classroom", "printable", "fen", "teacher", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
chessboard = "chessboard.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/chessboard"
Source = "https://github.com/eastyou/chessboard"

[tool.setuptools]
packages = ["chessboard"]
